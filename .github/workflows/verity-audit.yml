name: Verity Audit

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install Verity CLI
        run: pip install verity-audit
      
      - name: Run Audit
        env:
          VERITY_API_KEY: ${{ secrets.VERITY_API_KEY }}
        run: |
          verity audit --config verity.yml --upload
